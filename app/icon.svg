<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Background rounded square -->
  <rect width="32" height="32" rx="7" fill="#0F172A"/>

  <!-- Chart pulse line -->
  <polyline
    points="3,22 8,22 11,14 14,18 17,10 20,16 23,12 29,12"
    fill="none"
    stroke="#3B82F6"
    stroke-width="2.2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Upward arrow tip -->
  <polyline
    points="26,9 29,12 26,15"
    fill="none"
    stroke="#3B82F6"
    stroke-width="2.2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- "MP" text -->
  <text
    x="16"
    y="30"
    text-anchor="middle"
    font-family="Arial, sans-serif"
    font-weight="700"
    font-size="7"
    fill="#FFFFFF"
    letter-spacing="0.5"
  >MP</text>
</svg>
